<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <title>Tejido a mano</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  </head>
  <body>
    <header>
      <div class="div-logo"><a class="logo" href="../index.html">LOGO</a></div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="./contactos.html">Contacto</a></li>

            <a href="./carrito.html" class="carrito-icono"
              >🛒 Carrito <span id="contador-carrito">0</span></a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1 class="titulo-contacto text-secondary">Contactanos</h1>

      <form
        class="form-contacto"
        action="https://formspree.io/f/xykonaqk"
        method="POST"
      >
        <div class="grupo-input">
          <label for="email"> Your email: </label>
          <input id="email" type="email" name="email" />
        </div>
        <div class="grupo-input">
          <label for="mensaje"> Your message: </label>
          <textarea id="mensaje" name="message"></textarea>
        </div>
        <!-- your other form fields go here -->
        <button class="btn bg-secondary text-dark" type="submit">Send</button>
      </form>
    </main>
    <footer>
      <p>Sitio realizado por Paula para el curso deTalento Tech</p>
      <nav>
        <ul class="footer-list">
          <li><img src="../img/whatsapp.png" alt="logo de whatsapp" /></li>
          <li><img src="../img/instagram.png" alt="logo de instagram" /></li>
        </ul>
      </nav>
    </footer>

    <script src="../js/contacto.js" type="module"></script>
  </body>
